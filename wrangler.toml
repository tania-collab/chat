name = "chat"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Keep the variables set in the Cloudflare dashboard (ACCESS_TEAM_DOMAIN, ACCESS_AUD, ...) when deploying from git.
keep_vars = true

# Connections, settings and delivery logs. Without an id, Wrangler creates the namespace on first deploy.
[[kv_namespaces]]
binding = "RELAY"

# Summaries: every hour at :30; the worker sends each chat's summary on the days and at the hour (Pacific time)
# the chat chose, and does nothing the rest of the time.
[triggers]
crons = ["30 * * * *"]
